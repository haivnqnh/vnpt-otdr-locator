<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dò Điểm Đứt Cáp Quang OTDR - TTVT Cẩm Phả</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #map { width: 100%; height: 100%; z-index: 1; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

    @keyframes pulseAlert {
      0%, 100% { background-color: #dc2626; transform: scale(1); }
      50% { background-color: #991b1b; transform: scale(1.02); }
    }
    .alert-blink {
      animation: pulseAlert 0.8s infinite;
    }

    body.high-contrast {
      filter: contrast(1.25) saturate(1.2);
    }
    body.high-contrast .panel-card {
      background-color: #ffffff !important;
      border: 2px solid #000000 !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-900 flex flex-col h-screen">

  <!-- HEADER: Nhận diện VNPT & Kỹ thuật viên -->
  <header class="bg-[#005aab] text-white px-3 py-2 flex items-center justify-between shadow-md z-20 shrink-0 border-b border-blue-400/30">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="bg-white text-[#005aab] font-black px-2 py-1 rounded text-xs tracking-wider shadow-sm shrink-0">
        VNPT
      </div>
      <div class="min-w-0">
        <div class="text-xs sm:text-sm font-extrabold uppercase tracking-tight text-amber-300 truncate">
          Trung Tâm Viễn Thông Cẩm Phả
        </div>
        <div class="text-[11px] sm:text-xs font-medium text-blue-50 flex items-center gap-1.5 truncate">
          <span class="font-bold text-white">Vũ Ngọc Hải</span>
          <span class="text-blue-300">•</span>
          <a href="tel:0918961781" class="underline decoration-blue-300 hover:text-amber-200 font-mono">0918961781</a>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0">
      <!-- Nút hướng dẫn kỹ thuật viên -->
      <button onclick="toggleGuideModal()" title="Hướng dẫn kỹ thuật viên" class="p-2 rounded-lg bg-blue-800/80 hover:bg-blue-700 active:scale-95 transition">
        <i data-lucide="help-circle" class="w-4 h-4"></i>
      </button>
      <!-- Nút chế độ ngoài trời nắng -->
      <button id="btnSunMode" onclick="toggleSunMode()" title="Chế độ tương phản cao ngoài trời" class="p-2 rounded-lg bg-blue-800/80 hover:bg-blue-700 active:scale-95 transition">
        <i data-lucide="sun" class="w-4 h-4"></i>
      </button>
      <!-- Nút lịch sử các ca đo -->
      <button onclick="toggleHistoryModal()" title="Lịch sử đo kiểm" class="p-2 rounded-lg bg-blue-800/80 hover:bg-blue-700 active:scale-95 transition relative">
        <i data-lucide="history" class="w-4 h-4"></i>
        <span id="historyCount" class="hidden absolute -top-1 -right-1 bg-amber-400 text-slate-900 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </button>
    </div>
  </header>

  <!-- BẢNG THÔNG SỐ ĐO KIỂM TRÊN CÙNG -->
  <div class="bg-white/95 backdrop-blur px-3 py-2 shadow-md z-20 shrink-0 border-b border-slate-200 panel-card">
    <!-- Hàng 1: Khoảng cách OTDR, Độ trùng võng cáp (%) & GPS -->
    <div class="grid grid-cols-12 gap-1.5 items-center mb-2">
      <!-- Nhập khoảng cách OTDR -->
      <div class="col-span-4">
        <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">OTDR (m)</label>
        <div class="relative flex items-center">
          <input id="otdrInput" type="number" inputmode="decimal" placeholder="VD: 850" oninput="updateCalculations()"
            class="w-full bg-slate-100 border-2 border-blue-600 rounded-lg px-2 py-1 text-sm font-extrabold text-blue-900 focus:outline-none focus:bg-white" />
          <span class="absolute right-2 text-[11px] font-bold text-slate-500">m</span>
        </div>
      </div>

      <!-- Độ trùng võng cáp / hệ số dự phòng (%) -->
      <div class="col-span-3">
        <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">Trùng võng</label>
        <select id="sagFactor" onchange="updateCalculations()"
          class="w-full bg-slate-100 border-2 border-slate-300 rounded-lg px-1.5 py-1 text-xs font-extrabold text-slate-800 focus:outline-none focus:border-blue-600">
          <option value="0">0%</option>
          <option value="1" selected>+1%</option>
          <option value="1.5">+1.5%</option>
          <option value="2">+2%</option>
          <option value="3">+3%</option>
        </select>
      </div>

      <!-- Tọa độ GPS hiện tại -->
      <div class="col-span-5 bg-slate-100 rounded-lg p-1.5 border border-slate-300 flex items-center justify-between">
        <div class="overflow-hidden pr-1">
          <div class="flex items-center gap-1">
            <span id="gpsDot" class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
            <span id="gpsAccuracy" class="text-[10px] font-bold px-1 rounded bg-slate-200 text-slate-700">GPS...</span>
          </div>
          <div id="coordText" class="text-[11px] font-mono font-bold text-slate-800 truncate mt-0.5">
            Chờ vệ tinh...
          </div>
        </div>
        <button onclick="copyCurrentCoords()" title="Sao chép tọa độ & thông tin KTV" class="p-1.5 bg-white border border-slate-300 rounded-md shadow-sm active:bg-blue-50 text-blue-700 shrink-0">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- Hàng 2: Thẻ hiển thị Quãng đường đã đi & Khoảng cách còn lại -->
    <div id="statusBanner" class="rounded-xl p-2.5 bg-slate-800 text-white transition-colors duration-300">
      <div class="grid grid-cols-2 gap-2 divide-x divide-slate-600/60">
        <div>
          <div class="text-[10px] uppercase tracking-wider opacity-80 font-semibold">Đã di chuyển từ GPON</div>
          <div class="flex items-baseline gap-1">
            <span id="traveledDist" class="text-2xl font-black tracking-tight">0.0</span>
            <span class="text-xs font-bold opacity-80">m</span>
          </div>
        </div>
        <div class="pl-3">
          <div class="text-[10px] uppercase tracking-wider opacity-80 font-semibold" id="remainLabel">Còn cách điểm đứt</div>
          <div class="flex items-baseline gap-1">
            <span id="remainDist" class="text-2xl font-black tracking-tight">--</span>
            <span class="text-xs font-bold opacity-80">m</span>
          </div>
        </div>
      </div>

      <div class="w-full bg-black/30 h-2 rounded-full mt-2 overflow-hidden">
        <div id="progressBar" class="bg-emerald-400 h-full transition-all duration-300" style="width: 0%"></div>
      </div>
      <div id="alertMessage" class="text-[11px] font-bold mt-1.5 text-center text-blue-200">
        Đứng tại Hộp GPON (Điểm A) và bấm "Bắt đầu đo từ GPON"
      </div>
    </div>
  </div>

  <!-- KHU VỰC BẢN ĐỒ CHÍNH -->
  <div class="relative flex-1 w-full">
    <div id="map"></div>

    <div class="absolute top-3 right-3 z-10 flex flex-col gap-2">
      <button onclick="toggleMapLayer()" class="bg-white/95 backdrop-blur px-2.5 py-2 rounded-xl shadow-lg border border-slate-300 flex flex-col items-center gap-0.5 active:scale-95 transition">
        <i data-lucide="layers" class="w-5 h-5 text-blue-700"></i>
        <span id="layerLabel" class="text-[10px] font-bold text-slate-700">Vệ tinh</span>
      </button>

      <button onclick="centerOnUser()" class="bg-white/95 backdrop-blur p-2.5 rounded-xl shadow-lg border border-slate-300 flex items-center justify-center active:scale-95 transition">
        <i data-lucide="crosshair" class="w-5 h-5 text-blue-700"></i>
      </button>

      <button id="btnManualMode" onclick="toggleManualMode()" class="bg-white/95 backdrop-blur px-2 py-2 rounded-xl shadow-lg border border-slate-300 flex flex-col items-center gap-0.5 active:scale-95 transition">
        <i data-lucide="mouse-pointer-click" class="w-5 h-5 text-slate-700"></i>
        <span class="text-[10px] font-bold text-slate-700">Chấm tay</span>
      </button>

      <button onclick="openInGoogleMaps()" class="bg-white/95 backdrop-blur px-2 py-2 rounded-xl shadow-lg border border-slate-300 flex flex-col items-center gap-0.5 active:scale-95 transition">
        <i data-lucide="external-link" class="w-5 h-5 text-emerald-600"></i>
        <span class="text-[10px] font-bold text-slate-700">G-Maps</span>
      </
